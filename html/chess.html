<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
                        /* Ensure dropdown options are visible */
                        .chess-controls select,
                        .chess-controls select option {
                            background: linear-gradient(90deg, #4169E1 60%, #764ba2 100%);
                            color: white;
                        }
                        .chess-controls select option {
                            background: #4169E1;
                            color: #fff;
                        }
                /* Uniform dropdown style for chess controls */
                .chess-controls select {
                    background: linear-gradient(90deg, #4169E1 60%, #764ba2 100%);
                    color: white;
                    border: none;
                    border-radius: 12px;
                    padding: 13px 28px;
                    font-size: 1.12em;
                    height: 48px;
                    min-width: 170px;
                    cursor: pointer;
                    margin: 0 10px;
                    transition: background 0.2s, box-shadow 0.2s, transform 0.18s;
                    box-shadow: 0 2px 10px rgba(65,105,225,0.13);
                    font-weight: 600;
                    letter-spacing: 0.5px;
                    appearance: none;
                    display: inline-block;
                    vertical-align: middle;
                }
                .chess-controls select:focus {
                    outline: none;
                    background: linear-gradient(90deg, #2c5aa0 60%, #764ba2 100%);
                    box-shadow: 0 6px 18px rgba(65,105,225,0.18);
                }
        .chess-container {
            max-width: 900px;
            margin: 48px auto;
            background: linear-gradient(135deg, #eaf0fa 0%, #cfd8e3 100%);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(65,105,225,0.18);
            padding: 36px 36px 36px 36px;
            display: flex;
            flex-direction: row;
            gap: 32px;
            justify-content: center;
            align-items: flex-start;
            box-sizing: border-box;
        }
        .chess-board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 0;
            width: min(90vw, 480px);
            height: min(90vw, 480px);
            min-width: 320px;
            min-height: 320px;
            max-width: 100vw;
            max-height: 90vw;
            margin: 0 auto;
            border: 4px solid #4169E1;
            border-radius: 18px;
            background: linear-gradient(135deg, #b6c7e3 60%, #eaf0fa 100%);
            box-shadow: 0 6px 32px 0 rgba(65,105,225,0.13);
            overflow: hidden;
        }
        .chess-cell {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
            cursor: pointer;
            user-select: none;
            transition: background 0.18s, box-shadow 0.18s, transform 0.18s;
            position: relative;
            border-radius: 8px;
        }
        .chess-cell.white { background: linear-gradient(135deg, #f8fbff 80%, #eaf0fa 100%); }
        .chess-cell.black { background: linear-gradient(135deg, #cfd8e3 80%, #b6c7e3 100%); }
        .chess-cell.selected {
            outline: 3px solid #ff9800;
            z-index: 2;
            box-shadow: 0 0 0 6px #ffe0b2;
        }
        .chess-cell:hover {
            background: #e3e8f0 !important;
            transform: scale(1.07);
            z-index: 1;
            box-shadow: 0 2px 12px #4169e133;
        }
        .chess-cell .piece {
            transition: transform 0.18s cubic-bezier(.4,2,.6,1), filter 0.18s;
            will-change: transform;
            text-shadow: 0 2px 8px #4169e122, 0 1px 0 #fff;
        }
        .chess-cell.moving .piece {
            transform: scale(1.18) rotate(-6deg);
            filter: drop-shadow(0 2px 8px #4169e1aa);
        }
        .chess-status {
            margin-bottom: 22px;
            font-size: 1.22em;
            color: #2d3a4a;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: #f8fbff;
            border-radius: 8px;
            padding: 8px 0 8px 0;
            box-shadow: 0 1px 4px #4169e111;
        }
        .chess-controls {
            margin-top: 22px;
        }
        .chess-controls button {
            background: linear-gradient(90deg, #4169E1 60%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 28px;
            font-size: 1.12em;
            cursor: pointer;
            margin: 0 10px;
            transition: background 0.2s, box-shadow 0.2s, transform 0.18s;
            box-shadow: 0 2px 10px rgba(65,105,225,0.13);
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .chess-controls button:hover {
            background: linear-gradient(90deg, #2c5aa0 60%, #764ba2 100%);
            transform: translateY(-2px) scale(1.06);
            box-shadow: 0 6px 18px rgba(65,105,225,0.18);
        }
            .chess-movelog-panel {
                min-width: 170px;
                max-width: 220px;
                background: linear-gradient(135deg, #f8fbff 80%, #eaf0fa 100%);
                border-radius: 16px;
                box-shadow: 0 2px 16px #4169e11a;
                padding: 22px 16px 22px 16px;
                margin-top: 38px;
            }
            .chess-movelog-title {
                font-weight: 700;
                color: #2d3a4a;
                margin-bottom: 12px;
                font-size: 1.13em;
                letter-spacing: 0.5px;
                display: flex;
                align-items: center;
                gap: 7px;
            }
            .chess-movelog-list {
                font-size: 1.04em;
                color: #333;
                padding-left: 20px;
                margin: 0;
                min-height: 320px;
                background: #f8fbff;
                border-radius: 8px;
                box-shadow: 0 1px 4px #4169e111;
            }
    </style>
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
        <div id="game-stats-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(44,58,100,0.18); z-index:9999; align-items:center; justify-content:center;">
            <div style="background:#f8fbff; border-radius:18px; box-shadow:0 4px 24px #4169e133; padding:32px 24px; text-align:center; min-width:260px;">
                <div id="game-stats-title" style="font-size:1.18em; font-weight:600; color:#2d3a4a; margin-bottom:18px;"></div>
                <div id="game-stats-details" style="font-size:1.08em; color:#2d3a4a; margin-bottom:18px;"></div>
                <button onclick="closeStatsModal()" style="font-size:1em; background:#eaf0fa; border:2px solid #b6c7e3; border-radius:10px; padding:10px 22px; cursor:pointer;">Close</button>
            </div>
        </div>
    <div class="chess-container" style="display: flex; flex-direction: row; gap: 32px; justify-content: center; align-items: flex-start;">
        <div style="flex: 0 0 auto;">
            <h1 style="margin-bottom: 10px; color: #333;"><i class="fas fa-chess"></i> Chess Game</h1>
            <div class="chess-status" id="chess-status">White's turn</div>
            <div class="chess-board" id="chess-board"></div>
            <div id="timers-and-countdown" style="display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:18px;">
                <div style="display:flex; gap:24px; justify-content:center;">
                    <div id="white-timer" style="font-size:1.08em; color:#2d3a4a; background:#f8fbff; border-radius:8px; box-shadow:0 1px 4px #4169e111; padding:6px 16px;">White: 00:00</div>
                    <div id="black-timer" style="font-size:1.08em; color:#2d3a4a; background:#f8fbff; border-radius:8px; box-shadow:0 1px 4px #4169e111; padding:6px 16px;">Black: 00:00</div>
                </div>
                <div id="lone-king-countdown" style="display:none; font-size:1.12em; color:#d35400; font-weight:600; background:#f8fbff; border-radius:8px; box-shadow:0 1px 4px #4169e111; padding:8px 18px; text-align:center;"></div>
            </div>
            <div class="chess-controls" style="margin-top:24px; display:flex; gap:16px; justify-content:center;">
                <button onclick="resetChess()"><i class="fas fa-undo"></i> Reset</button>
                <button id="toggle-computer" onclick="toggleComputer()"><i class="fas fa-robot"></i> Play vs Computer</button>
                <select id="computer-difficulty" style="padding:7px 12px; border-radius:7px; border:1px solid #4169E1; font-size:1em;">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
        </div>
        <div id="promotion-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(44,58,100,0.18); z-index:9999; align-items:center; justify-content:center;">
            <div style="background:#f8fbff; border-radius:18px; box-shadow:0 4px 24px #4169e133; padding:32px 24px; text-align:center; min-width:260px;">
                <div style="font-size:1.18em; font-weight:600; color:#2d3a4a; margin-bottom:18px;">Promote Pawn To:</div>
                <div id="promotion-choices" style="display:flex; gap:18px; justify-content:center;"></div>
            </div>
        </div>
        <div class="chess-movelog-panel">
            <div class="chess-movelog-title"><i class="fas fa-list-ol"></i> Move Log</div>
            <ol id="chess-movelog" class="chess-movelog-list"></ol>
        </div>
    </div>
    <script>
                                            let whiteTime = 0, blackTime = 0;
                                            let timerInterval = null;
                                            function formatTime(sec) {
                                                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                                                const s = (sec % 60).toString().padStart(2, '0');
                                                return `${m}:${s}`;
                                            }
                                            function updateTimers() {
                                                document.getElementById('white-timer').textContent = `White: ${formatTime(whiteTime)}`;
                                                document.getElementById('black-timer').textContent = `Black: ${formatTime(blackTime)}`;
                                            }
                                            function startTimer() {
                                                if (timerInterval) clearInterval(timerInterval);
                                                timerInterval = setInterval(() => {
                                                    if (whiteTurn) {
                                                        whiteTime++;
                                                    } else {
                                                        blackTime++;
                                                    }
                                                    updateTimers();
                                                    startTimer();
                                                }, 1000);
                                            }
                                            function stopTimer() {
                                                if (timerInterval) clearInterval(timerInterval);
                                            }
                                    function showStatsModal(title, details) {
                                        document.getElementById('game-stats-title').textContent = title;
                                        document.getElementById('game-stats-details').innerHTML = details;
                                        document.getElementById('game-stats-modal').style.display = 'flex';
                                    }
                                    function closeStatsModal() {
                                        document.getElementById('game-stats-modal').style.display = 'none';
                                    }
                            let loneKingMoveCount = 0;
                            let loneKingActive = false;
                        // Utility: clone board
                        function cloneBoard(src) {
                            return src.map(row => row.slice());
                        }

                        // Utility: find king position
                        function findKing(board, isWhite) {
                            const king = isWhite ? 'K' : 'k';
                            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (board[r][c] === king) return [r, c];
                            return null;
                        }

                        // Utility: is king attacked
                        function isKingInCheck(board, isWhite) {
                            const kingPos = findKing(board, isWhite);
                            if (!kingPos) return false;
                            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                                const piece = board[r][c];
                                if (piece && ((isWhite && piece === piece.toLowerCase()) || (!isWhite && piece === piece.toUpperCase()))) {
                                    if (isValidMoveCustom(board, r, c, kingPos[0], kingPos[1])) return true;
                                }
                            }
                            return false;
                        }

                        // Utility: isValidMove for arbitrary board
                        function isValidMoveCustom(board, fromRow, fromCol, toRow, toCol) {
                            // Same as isValidMove, but for a given board
                            const piece = board[fromRow][fromCol];
                            const target = board[toRow][toCol];
                            if (!piece) return false;
                            if (piece === target) return false;
                            if (target && ((piece === piece.toUpperCase() && target === target.toUpperCase()) || (piece === piece.toLowerCase() && target === target.toLowerCase()))) return false;
                            if (fromRow === toRow && fromCol === toCol) return false;
                            const isWhite = piece === piece.toUpperCase();
                            const dr = toRow - fromRow;
                            const dc = toCol - fromCol;
                            const absDr = Math.abs(dr);
                            const absDc = Math.abs(dc);
                            switch (piece.toLowerCase()) {
                                case 'p': {
                                    const dir = isWhite ? -1 : 1;
                                    if (dc === 0 && !target) {
                                        if (dr === dir) return true;
                                        if ((isWhite && fromRow === 6 || !isWhite && fromRow === 1) && dr === 2 * dir && !board[fromRow + dir][fromCol]) return true;
                                    }
                                    if (absDc === 1 && dr === dir && target && ((isWhite && target === target.toLowerCase()) || (!isWhite && target === target.toUpperCase()))) {
                                        return true;
                                    }
                                    return false;
                                }
                                case 'r': {
                                    if (dr !== 0 && dc !== 0) return false;
                                    const stepR = dr === 0 ? 0 : dr / absDr;
                                    const stepC = dc === 0 ? 0 : dc / absDc;
                                    let r = fromRow + stepR, c = fromCol + stepC;
                                    while ((r !== toRow || c !== toCol)) {
                                        if (board[r][c]) return false;
                                        r += stepR; c += stepC;
                                    }
                                    return true;
                                }
                                case 'n': {
                                    return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
                                }
                                case 'b': {
                                    if (absDr !== absDc) return false;
                                    const stepR = dr / absDr;
                                    const stepC = dc / absDc;
                                    let r = fromRow + stepR, c = fromCol + stepC;
                                    while ((r !== toRow || c !== toCol)) {
                                        if (board[r][c]) return false;
                                        r += stepR; c += stepC;
                                    }
                                    return true;
                                }
                                case 'q': {
                                    if (dr === 0 || dc === 0) {
                                        const stepR = dr === 0 ? 0 : dr / (absDr || 1);
                                        const stepC = dc === 0 ? 0 : dc / (absDc || 1);
                                        let r = fromRow + stepR, c = fromCol + stepC;
                                        while ((r !== toRow || c !== toCol)) {
                                            if (board[r][c]) return false;
                                            r += stepR; c += stepC;
                                        }
                                        return true;
                                    } else if (absDr === absDc) {
                                        const stepR = dr / absDr;
                                        const stepC = dc / absDc;
                                        let r = fromRow + stepR, c = fromCol + stepC;
                                        while ((r !== toRow || c !== toCol)) {
                                            if (board[r][c]) return false;
                                            r += stepR; c += stepC;
                                        }
                                        return true;
                                    }
                                    return false;
                                }
                                case 'k': {
                                    return absDr <= 1 && absDc <= 1;
                                }
                            }
                            return false;
                        }

                        // Utility: get all legal moves for color
                        function getLegalMoves(board, isWhite) {
                            let moves = [];
                            for (let fromRow = 0; fromRow < 8; fromRow++) {
                                for (let fromCol = 0; fromCol < 8; fromCol++) {
                                    const piece = board[fromRow][fromCol];
                                    if (piece && ((isWhite && piece === piece.toUpperCase()) || (!isWhite && piece === piece.toLowerCase()))) {
                                        for (let toRow = 0; toRow < 8; toRow++) {
                                            for (let toCol = 0; toCol < 8; toCol++) {
                                                if (isValidMoveCustom(board, fromRow, fromCol, toRow, toCol)) {
                                                    // Simulate move
                                                    let testBoard = cloneBoard(board);
                                                    testBoard[toRow][toCol] = testBoard[fromRow][fromCol];
                                                    testBoard[fromRow][fromCol] = '';
                                                    if (!isKingInCheck(testBoard, isWhite)) {
                                                        moves.push({fromRow, fromCol, toRow, toCol});
                                                    }
                                                }
                                            }
                                        }
                                    }
                                }
                            }
                            return moves;
                        }

                        // Utility: checkmate detection
                        function checkGameStatus() {
                            if (gameOver) return;
                            const whiteInCheck = isKingInCheck(board, true);
                            const blackInCheck = isKingInCheck(board, false);
                            const whiteMoves = getLegalMoves(board, true);
                            const blackMoves = getLegalMoves(board, false);
                            if (whiteInCheck && whiteMoves.length === 0) {
                                statusDiv.textContent = 'Checkmate! Black wins!';
                                gameOver = true;
                                stopTimer();
                            } else if (blackInCheck && blackMoves.length === 0) {
                                statusDiv.textContent = 'Checkmate! White wins!';
                                gameOver = true;
                                stopTimer();
                            } else if (whiteInCheck) {
                                statusDiv.textContent = "White's turn (Check!)";
                            } else if (blackInCheck) {
                                statusDiv.textContent = "Black's turn (Check!)";
                            } else {
                                statusDiv.textContent = whiteTurn ? "White's turn" : "Black's turn";
                            }
                        }
                let gameOver = false;
            let playVsComputer = false;
            let computerDifficulty = 'easy';
                        // Listen for difficulty change
                        document.addEventListener('DOMContentLoaded', function() {
                            const diffSel = document.getElementById('computer-difficulty');
                            if (diffSel) {
                                diffSel.addEventListener('change', function() {
                                    computerDifficulty = this.value;
                                });
                                computerDifficulty = diffSel.value;
                            }
                        });
                function toggleComputer() {
                    playVsComputer = !playVsComputer;
                    const btn = document.getElementById('toggle-computer');
                    btn.innerHTML = playVsComputer ? '<i class="fas fa-user"></i> Play 2 Players' : '<i class="fas fa-robot"></i> Play vs Computer';
                    resetChess();
                }
        // Unicode chess pieces
        const PIECES = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙',
            '': ''
        };
        // Initial board FEN
        let board = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];
        let selected = null;
        let whiteTurn = true;
        let moveLog = [];
        let statusDiv = document.getElementById('chess-status');
        const boardDiv = document.getElementById('chess-board');
        const moveLogOl = document.getElementById('chess-movelog');

        let promotionCallback = null;
        function showPromotionModal(isWhite, callback) {
            const modal = document.getElementById('promotion-modal');
            const choicesDiv = document.getElementById('promotion-choices');
            choicesDiv.innerHTML = '';
            const pieces = isWhite ? ['Q','R','B','N'] : ['q','r','b','n'];
            pieces.forEach(p => {
                const btn = document.createElement('button');
                btn.textContent = PIECES[p];
                btn.style.fontSize = '2.2em';
                btn.style.background = '#eaf0fa';
                btn.style.border = '2px solid #b6c7e3';
                btn.style.borderRadius = '10px';
                btn.style.padding = '12px 18px';
                btn.style.cursor = 'pointer';
                btn.onclick = () => {
                    modal.style.display = 'none';
                    callback(p);
                };
                choicesDiv.appendChild(btn);
            });
            modal.style.display = 'flex';
            promotionCallback = callback;
        }

        function renderBoard() {
            boardDiv.innerHTML = '';
            if (gameOver) {
                statusDiv.textContent = 'Game Over!';
            }
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'chess-cell ' + ((row+col)%2===0 ? 'white' : 'black');
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    if (selected && selected[0] === row && selected[1] === col) {
                        cell.classList.add('selected');
                    }
                    // Add hover effect
                    cell.onmouseenter = () => cell.classList.add('hovered');
                    cell.onmouseleave = () => cell.classList.remove('hovered');
                    // Add piece span for animation
                    const piece = board[row][col];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = 'piece';
                        pieceSpan.textContent = PIECES[piece];
                        cell.appendChild(pieceSpan);
                    }
                    cell.onclick = () => onCellClick(row, col);
                    boardDiv.appendChild(cell);
                }
            }
            renderMoveLog();
        }

        function onCellClick(row, col) {
            if (gameOver) {
                // Show stats modal at game end
                let winnerText = statusDiv.textContent.replace(/!.*$/, '').replace('Game Over!', '').trim();
                let winnerMoves = 0;
                let stats = '';
                let winnerLabel = '';
                if (winnerText.includes('Lone King')) {
                    winnerLabel = 'Lone King';
                    winnerMoves = loneKingMoveCount;
                    stats += `<b>Lone King survived:</b> ${winnerMoves} moves`;
                } else if (winnerText.includes('White')) {
                    winnerLabel = 'White';
                    winnerMoves = Math.ceil(moveLog.length / 2);
                    stats += `<b>White moves made:</b> ${winnerMoves}<br>`;
                } else if (winnerText.includes('Black')) {
                    winnerLabel = 'Black';
                    winnerMoves = Math.floor(moveLog.length / 2);
                    stats += `<b>Black moves made:</b> ${winnerMoves}<br>`;
                } else if (winnerText.toLowerCase().includes('draw')) {
                    winnerLabel = 'Draw';
                    winnerMoves = moveLog.length;
                    stats += `<b>Total moves made:</b> ${winnerMoves}<br>`;
                } else {
                    winnerLabel = winnerText;
                    winnerMoves = moveLog.length;
                    stats += `<b>Moves made:</b> ${winnerMoves}<br>`;
                }
                stats += `<b>White total time:</b> ${formatTime(whiteTime)}<br>`;
                stats += `<b>Black total time:</b> ${formatTime(blackTime)}<br>`;
                showStatsModal(winnerLabel, stats);
                return;
            }
            // Lone king logic
            function onlyKingLeft(isWhite) {
                let count = 0;
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && ((isWhite && p === p.toUpperCase()) || (!isWhite && p === p.toLowerCase()))) {
                            if (p.toLowerCase() !== 'k') count++;
                        }
                    }
                }
                return count === 0;
            }
            const countdownDiv = document.getElementById('lone-king-countdown');
            if (onlyKingLeft(whiteTurn) || onlyKingLeft(!whiteTurn)) {
                if (!loneKingActive) {
                    loneKingActive = true;
                    loneKingMoveCount = 0;
                }
                loneKingMoveCount++;
                countdownDiv.style.display = 'block';
                countdownDiv.textContent = `Lone King Countdown: ${50 - loneKingMoveCount} moves left to win by default.`;
                statusDiv.textContent = `Lone King! Survive ${50 - loneKingMoveCount} moves to win by default.`;
                if (loneKingMoveCount >= 50) {
                    countdownDiv.textContent = 'Lone King survived 50 moves! Win by default.';
                    statusDiv.textContent = 'Lone King survived 50 moves! Win by default.';
                    gameOver = true;
                    stopTimer();
                }
            } else {
                loneKingActive = false;
                loneKingMoveCount = 0;
                countdownDiv.style.display = 'none';
            }
            const piece = board[row][col];
            if (selected) {
                // Try to move
                if (isValidMove(selected[0], selected[1], row, col)) {
                    // Simulate move to check legality
                    let testBoard = cloneBoard(board);
                    testBoard[row][col] = testBoard[selected[0]][selected[1]];
                    testBoard[selected[0]][selected[1]] = '';
                    if (isKingInCheck(testBoard, whiteTurn)) {
                        selected = null;
                        renderBoard();
                        checkGameStatus();
                        return;
                    }
                    // Pawn promotion check
                    const movingPiece = board[selected[0]][selected[1]];
                    const isPawn = movingPiece && (movingPiece.toLowerCase() === 'p');
                    const promotionRow = (whiteTurn && row === 0) || (!whiteTurn && row === 7);
                    if (isPawn && promotionRow) {
                        showPromotionModal(whiteTurn, function(promotedPiece) {
                            // Log move
                            const moveNotation = getMoveNotation(selected[0], selected[1], row, col, movingPiece, board[row][col]) + '=' + promotedPiece.toUpperCase();
                            moveLog.push(moveNotation);
                            board[row][col] = promotedPiece;
                            board[selected[0]][selected[1]] = '';
                            selected = null;
                            whiteTurn = !whiteTurn;
                            renderBoard();
                            checkGameStatus();
                            if (playVsComputer && !whiteTurn && !gameOver) {
                                setTimeout(computerMove, 400);
                            }
                        });
                        return;
                    }
                    // Animate piece movement
                    const fromCell = boardDiv.children[selected[0]*8 + selected[1]];
                    if (fromCell) fromCell.classList.add('moving');
                    setTimeout(() => {
                        // Log move
                        const moveNotation = getMoveNotation(selected[0], selected[1], row, col, board[selected[0]][selected[1]], board[row][col]);
                        moveLog.push(moveNotation);
                        board[row][col] = board[selected[0]][selected[1]];
                        board[selected[0]][selected[1]] = '';
                        selected = null;
                        whiteTurn = !whiteTurn;
                        renderBoard();
                        checkGameStatus();
                        // If vs computer and now black's turn, let computer move
                        if (playVsComputer && !whiteTurn && !gameOver) {
                            setTimeout(computerMove, 400);
                        }
                    }, 120);
                    return;
                } else {
                    selected = null;
                }
            } else if (piece && ((whiteTurn && piece === piece.toUpperCase()) || (!whiteTurn && piece === piece.toLowerCase()))) {
                selected = [row, col];
            }
            renderBoard();
            checkGameStatus();
        }

        function computerMove() {
            if (gameOver) return;
            // Get all legal moves for black
            let moves = getLegalMoves(board, false);
            if (moves.length === 0) {
                checkGameStatus();
                return;
            }
            // Difficulty logic
            let move;
            if (computerDifficulty === 'easy') {
                move = moves[Math.floor(Math.random() * moves.length)];
            } else if (computerDifficulty === 'medium') {
                // Prefer captures
                const captures = moves.filter(m => board[m.toRow][m.toCol]);
                if (captures.length > 0) move = captures[Math.floor(Math.random() * captures.length)];
                else move = moves[Math.floor(Math.random() * moves.length)];
            } else if (computerDifficulty === 'hard') {
                // Minimax search, depth 2 (computer and player reply)
                function getPieceValue(piece) {
                    switch (piece.toLowerCase()) {
                        case 'p': return 1;
                        case 'n': case 'b': return 3;
                        case 'r': return 5;
                        case 'q': return 9;
                        case 'k': return 0;
                        default: return 0;
                    }
                }
                function evaluateBoard(bd) {
                    let score = 0;
                    for (let r = 0; r < 8; r++) {
                        for (let c = 0; c < 8; c++) {
                            const p = bd[r][c];
                            if (p) {
                                if (p === p.toLowerCase()) score += getPieceValue(p);
                                else score -= getPieceValue(p);
                            }
                        }
                    }
                    // Bonus for check
                    if (isKingInCheck(bd, true)) score += 0.5;
                    return score;
                }
                let bestScore = -Infinity;
                let bestMoves = [];
                moves.forEach(m => {
                    let testBoard = cloneBoard(board);
                    testBoard[m.toRow][m.toCol] = testBoard[m.fromRow][m.fromCol];
                    testBoard[m.fromRow][m.fromCol] = '';
                    // Simulate player's best reply
                    let playerMoves = getLegalMoves(testBoard, true);
                    let worstReply = Infinity;
                    if (playerMoves.length > 0) {
                        playerMoves.forEach(pm => {
                            let replyBoard = cloneBoard(testBoard);
                            replyBoard[pm.toRow][pm.toCol] = replyBoard[pm.fromRow][pm.fromCol];
                            replyBoard[pm.fromRow][pm.fromCol] = '';
                            let replyScore = evaluateBoard(replyBoard);
                            if (replyScore < worstReply) worstReply = replyScore;
                        });
                    } else {
                        worstReply = evaluateBoard(testBoard);
                    }
                    if (worstReply > bestScore) {
                        bestScore = worstReply;
                        bestMoves = [m];
                    } else if (worstReply === bestScore) {
                        bestMoves.push(m);
                    }
                });
                move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
            } else {
                move = moves[Math.floor(Math.random() * moves.length)];
            }
            // Animate computer move
            const fromCell = boardDiv.children[move.fromRow*8 + move.fromCol];
            if (fromCell) fromCell.classList.add('moving');
            setTimeout(() => {
                const moveNotation = getMoveNotation(move.fromRow, move.fromCol, move.toRow, move.toCol, board[move.fromRow][move.fromCol], board[move.toRow][move.toCol]);
                moveLog.push(moveNotation);
                board[move.toRow][move.toCol] = board[move.fromRow][move.fromCol];
                board[move.fromRow][move.fromCol] = '';
                whiteTurn = !whiteTurn;
                renderBoard();
                checkGameStatus();
            }, 300);
        }

        // Simple algebraic notation for move log
        function getMoveNotation(fromRow, fromCol, toRow, toCol, piece, captured) {
            const files = 'abcdefgh';
            const ranks = '87654321';
            let move = '';
            if (piece.toLowerCase() !== 'p') move += piece.toUpperCase();
            move += files[fromCol] + ranks[fromRow];
            move += captured ? 'x' : '-';
            move += files[toCol] + ranks[toRow];
            return move;
        }

        function renderMoveLog() {
            if (!moveLogOl) return;
            moveLogOl.innerHTML = '';
            moveLog.forEach((move, idx) => {
                const li = document.createElement('li');
                li.textContent = move;
                moveLogOl.appendChild(li);
            });
            // Scroll to latest move
            moveLogOl.scrollTop = moveLogOl.scrollHeight;
        }

        function isValidMove(fromRow, fromCol, toRow, toCol) {
            // Enforce chess rules for each piece
            const piece = board[fromRow][fromCol];
            const target = board[toRow][toCol];
            if (!piece) return false;
            if (piece === target) return false;
            if (target && ((piece === piece.toUpperCase() && target === target.toUpperCase()) || (piece === piece.toLowerCase() && target === target.toLowerCase()))) return false;
            if (fromRow === toRow && fromCol === toCol) return false;

            const isWhite = piece === piece.toUpperCase();
            const dr = toRow - fromRow;
            const dc = toCol - fromCol;
            const absDr = Math.abs(dr);
            const absDc = Math.abs(dc);

            switch (piece.toLowerCase()) {
                case 'p': { // Pawn
                    // White pawns move up (to lower row), black down (to higher row)
                    const dir = isWhite ? -1 : 1;
                    // Move forward
                    if (dc === 0 && !target) {
                        // One square
                        if (dr === dir) return true;
                        // Two squares from initial position
                        if ((isWhite && fromRow === 6 || !isWhite && fromRow === 1) && dr === 2 * dir && !board[fromRow + dir][fromCol]) return true;
                    }
                    // Capture
                    if (absDc === 1 && dr === dir && target && ((isWhite && target === target.toLowerCase()) || (!isWhite && target === target.toUpperCase()))) {
                        return true;
                    }
                    return false;
                }
                case 'r': { // Rook
                    if (dr !== 0 && dc !== 0) return false;
                    // Check path is clear
                    const stepR = dr === 0 ? 0 : dr / absDr;
                    const stepC = dc === 0 ? 0 : dc / absDc;
                    let r = fromRow + stepR, c = fromCol + stepC;
                    while ((r !== toRow || c !== toCol)) {
                        if (board[r][c]) return false;
                        r += stepR; c += stepC;
                    }
                    return true;
                }
                case 'n': { // Knight
                    return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
                }
                case 'b': { // Bishop
                    if (absDr !== absDc) return false;
                    const stepR = dr / absDr;
                    const stepC = dc / absDc;
                    let r = fromRow + stepR, c = fromCol + stepC;
                    while ((r !== toRow || c !== toCol)) {
                        if (board[r][c]) return false;
                        r += stepR; c += stepC;
                    }
                    return true;
                }
                case 'q': { // Queen
                    if (dr === 0 || dc === 0) {
                        // Rook-like
                        const stepR = dr === 0 ? 0 : dr / (absDr || 1);
                        const stepC = dc === 0 ? 0 : dc / (absDc || 1);
                        let r = fromRow + stepR, c = fromCol + stepC;
                        while ((r !== toRow || c !== toCol)) {
                            if (board[r][c]) return false;
                            r += stepR; c += stepC;
                        }
                        return true;
                    } else if (absDr === absDc) {
                        // Bishop-like
                        const stepR = dr / absDr;
                        const stepC = dc / absDc;
                        let r = fromRow + stepR, c = fromCol + stepC;
                        while ((r !== toRow || c !== toCol)) {
                            if (board[r][c]) return false;
                            r += stepR; c += stepC;
                        }
                        return true;
                    }
                    return false;
                }
                case 'k': { // King
                    return absDr <= 1 && absDc <= 1;
                }
            }
            return false;
        }

        function resetChess() {
            board = [
                ['r','n','b','q','k','b','n','r'],
                ['p','p','p','p','p','p','p','p'],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['','','','','','','',''],
                ['P','P','P','P','P','P','P','P'],
                ['R','N','B','Q','K','B','N','R']
            ];
            selected = null;
            whiteTurn = true;
            moveLog = [];
            gameOver = false;
            statusDiv.textContent = "White's turn";
            renderBoard();
            checkGameStatus();
        }

        renderBoard();
        startTimer();
    </script>
</body>
